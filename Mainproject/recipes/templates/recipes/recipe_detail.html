{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="recipe-card">
        <div class="recipe-header">
            <h1 class="recipe-title">{{ recipe.name }}</h1>
        </div>

        {% if recipe.image %}
            <div class="recipe-image-container">
                <img src="{{ recipe.image.url }}" class="recipe-image" alt="{{ recipe.name }}">
            </div>
        {% endif %}

        <div class="recipe-details">
            <div class="recipe-section">
                <h3 class="section-title">📝 Description</h3>
                <p class="section-content">{{ recipe.description }}</p>
            </div>

            <div class="recipe-section">
                <h3 class="section-title">🥗 Ingredients</h3>
                <p class="section-content">{{ recipe.ingredients }}</p>
            </div>

            {% if recipe.source_link %}
                <div class="recipe-source">
                    <a href="{{ recipe.source_link }}" target="_blank" class="btn btn-outline-primary">
                        <span>🔗</span> View Original Recipe
                    </a>
                </div>
            {% endif %}
        </div>

        <div class="recipe-actions">
            <a href="{% url 'recipe_list' %}" class="btn btn-outline-primary">
                <span>🔙</span> Back to Recipes
            </a>
            <a href="{% url 'Markas' recipe.id %}" class="btn btn-primary">
                <span>✅</span> Mark as Made
            </a>
        </div>
    </div>
</div>

<style>
    /* Recipe detail page styles - matches site theme */
    .recipe-card {
        background-color: white;
        border-radius: var(--border-radius);
        box-shadow: var(--box-shadow);
        overflow: hidden;
        transition: all 0.3s;
        margin-bottom: 40px;
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
    }
    
    .recipe-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    
    .recipe-header {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        padding: 30px 25px;
        color: white;
        text-align: center;
    }
    
    .recipe-title {
        margin: 0;
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 2.2rem;
        font-weight: 700;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        color: white;
    }
    
    .recipe-image-container {
        width: 100%;
        height: 350px;
        overflow: hidden;
    }
    
    .recipe-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }
    
    .recipe-image:hover {
        transform: scale(1.05);
    }
    
    .recipe-details {
        padding: 30px;
    }
    
    .recipe-section {
        margin-bottom: 25px;
    }
    
    .section-title {
        font-size: 1.3rem;
        color: var(--primary);
        border-bottom: 2px solid var(--accent);
        padding-bottom: 10px;
        margin-bottom: 15px;
        font-family: 'Montserrat', 'Segoe UI', sans-serif;
        font-weight: 600;
    }
    
    .section-content {
        font-size: 1.1rem;
        line-height: 1.7;
        color: var(--text-dark);
        font-family: 'Georgia', serif;
    }
    
    .recipe-source {
        margin: 25px 0;
        text-align: center;
    }
    
    .recipe-actions {
        display: flex;
        justify-content: space-between;
        padding: 20px 30px;
        background-color: var(--light);
        border-top: 1px solid rgba(0,0,0,0.05);
    }
    
    .recipe-actions .btn {
        padding: 10px 22px;
        border-radius: 30px;
        font-weight: 500;
        letter-spacing: 0.5px;
        transition: all 0.3s;
        font-family: 'Montserrat', 'Segoe UI', sans-serif;
    }
    
    .recipe-actions .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }
    
    .recipe-actions .btn span {
        margin-right: 8px;
    }
    
    /* Responsive adjustments */
    @media (max-width: 768px) {
        .recipe-title {
            font-size: 1.8rem;
        }
        
        .recipe-image-container {
            height: 250px;
        }
        
        .recipe-details {
            padding: 20px;
        }
        
        .recipe-actions {
            flex-direction: column;
            gap: 15px;
        }
        
        .recipe-actions .btn {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    }
</style>
{% endblock %}
